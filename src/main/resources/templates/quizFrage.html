<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <title>Quiz</title>
    <link rel="stylesheet" th:href="@{/css/basicStyle.css}" />
</head>
<body>
    <h1>Nerdquiz</h1>
    <h2 th:text="${frage.frage}"></h2>
    <h3 th:text="*{frage.beantwortet} ? ${frage.antwort} : ''"></h3>
    <img th:if="${not (frage.bildFrage.isBlank() || frage.beantwortet)}" th:src="@{${frage.bildFrage}}" th:alt-title="${frage.frage}" />
    <img th:if="${not frage.bildAntwort.isBlank() && frage.beantwortet}" th:src="@{${frage.bildAntwort}}" th:alt-title="${frage.antwort}" />
</body>
<script>
    setInterval(refresh, 100);

    async function refresh() {
        const stateUrl = "http://localhost:8080/quizStateChanged/";
        const stateResponse = await fetch(stateUrl);
        if (stateResponse.ok) {
            const result = await stateResponse.json();
            const state = result["state"];
            if (state != "FRAGE"){
                location.reload();
            }
        }
        const teamUrl = "http://localhost:8080/teamQueued/";
        const teamResponse = await fetch(teamUrl);
        if (teamResponse.ok) {
            const result = await teamResponse.json();
            if (result["teamQueued"]){
                location.reload();
            }
        }
    }
</script>
</html>
