<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <title>Quiz</title>
    <link rel="stylesheet" th:href="@{/css/basicStyle.css}" />
</head>
<body>
    <h1>Willkommen zum Quiz!</h1>
    <p th:text="'Buzzer für Team ' + ${name} + '!'"></p>

    <form action="#" th:action="@{/buzzer/buzz}" method="post">
        <input type="text" th:disabled="${customUser}" th:hidden="${customUser}" name="teamName" placeholder="Gib deinen Namen ein" required maxlength="25">
        <input type="hidden" th:disabled="${defaultUser}" name="teamName" th:value="${name}" />
        <button id="buzzerButton" type="submit" th:style="'background-color:#444444'">Buzzer</button>
    </form>

    <script>
        const button = document.getElementById("buzzerButton");
        setInterval(manageBuzzerState, 100);

        async function manageBuzzerState() {

            const url = "http://localhost:8080/buzzerActive/";
            const response = await fetch(url);
            if (response.ok) {
                const result = await response.json();


                const bool = result["active"];
                if (bool) {
                    button.style.backgroundColor = "#FF4444";
                } else {
                    button.style.backgroundColor = "#444444";
                }
            }
        }
    </script>
</body>
</html>
